<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investia - Validation en attente</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --primary:#0b2a55;
      --border:rgba(15,23,42,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:16px;
      color:var(--text);
      background:
        radial-gradient(800px 260px at 20% 0%, rgba(11,42,85,.10), transparent 60%),
        radial-gradient(900px 320px at 100% 0%, rgba(18,65,138,.10), transparent 60%),
        var(--bg);
    }
    .card{
      width:min(640px,100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 20px 46px rgba(15,23,42,.10);
      padding:22px;
      text-align:center;
    }
    h1{
      margin:0 0 10px;
      color:var(--primary);
      font-size:28px;
    }
    p{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.6;
    }
    .btn{
      border:0;
      border-radius:12px;
      padding:11px 14px;
      font-size:14px;
      font-weight:800;
      color:#fff;
      background:linear-gradient(135deg, #12418a, #0b2a55);
      cursor:pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Acces bloque</h1>
    <p>
      Votre compte est en attente de validation admin ou non verifie.
      Vous ne pouvez pas acceder aux autres pages tant que votre statut n'est pas <b>VERIFIE</b>.
    </p>
    <button class="btn" id="logoutBtn" type="button">Retour a la connexion</button>
  </main>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (window.javaBridge && typeof window.javaBridge.logout === "function") {
        window.javaBridge.logout();
      }
    });
  </script>
</body>
</html>
