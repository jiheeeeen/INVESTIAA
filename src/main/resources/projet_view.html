<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investra - Mes projets (Entrepreneur)</title>
  <style>
    :root{
      --bg:#f6f8fc;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:rgba(15,23,42,.08);
      --shadow:0 14px 35px rgba(15,23,42,.08);
      --shadowHover:0 18px 45px rgba(15,23,42,.12);
      --primary:#1d4ed8;
      --accent:#06b6d4;
      --ok:#16a34a;
      --warn:#f59e0b;
      --danger:#ef4444;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
    }
    a{color:inherit; text-decoration:none}
    .container{max-width:1120px; margin:28px auto 60px; padding:0 16px;}

    /* Topbar */
    .topbar{
      display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
      margin-bottom:14px;
    }
    h1{margin:0; font-size:30px; font-weight:900; letter-spacing:.2px;}
    .subtitle{margin:8px 0 0; color:var(--muted); font-size:14.5px; line-height:1.5; max-width:80ch;}
    .actions{display:flex; gap:10px; flex-wrap:wrap;}

    .btn{
      border:0; cursor:pointer;
      font-weight:900; font-size:14px;
      padding:10px 14px; border-radius:12px;
      display:inline-flex; align-items:center; gap:8px;
      transition: transform .15s ease, filter .15s ease;
    }
    .btn.primary{
      background:linear-gradient(135deg, var(--primary), var(--accent));
      color:#fff; box-shadow:0 10px 20px rgba(29,78,216,.18);
    }
    .btn.ghost{
      background:#fff; border:1px solid var(--border); color:var(--text);
    }
    .btn:hover{transform:translateY(-1px); filter:brightness(1.02);}
    .btn:active{transform:translateY(0);}

    /* Filters */
    .filterbar{
      margin-top:14px;
      background:linear-gradient(135deg, rgba(29,78,216,.06), rgba(6,182,212,.04) 42%, rgba(255,255,255,.9));
      border:1px solid rgba(29,78,216,.15);
      border-radius:22px;
      box-shadow:0 20px 45px rgba(15,23,42,.09);
      padding:16px;
      display:grid;
      gap:14px;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:end;
      position:relative;
      overflow:hidden;
    }
    .filterbar::before{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      right:-90px;
      top:-130px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(29,78,216,.16) 0%, rgba(29,78,216,0) 70%);
      pointer-events:none;
    }
    .leftFilters{
      display:grid;
      gap:12px;
      grid-template-columns:repeat(2, minmax(220px, 1fr));
      align-items:end;
      position:relative;
      z-index:1;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:7px;
      min-width:0;
    }
    label{
      font-size:11.5px;
      font-weight:900;
      letter-spacing:.45px;
      text-transform:uppercase;
      color:#0b2a55;
    }
    .inputWrap, .selectWrap{
      position:relative;
      display:flex;
      align-items:center;
      background:#fff;
      border:1px solid rgba(15,23,42,.1);
      border-radius:14px;
      box-shadow:0 8px 20px rgba(15,23,42,.04);
    }
    .inputIcon, .selectIcon{
      font-size:13px;
      color:#64748b;
      pointer-events:none;
      user-select:none;
      position:absolute;
    }
    .inputIcon{left:12px;}
    .selectIcon{right:12px;}
    input, select{
      width:100%;
      padding:11px 12px;
      border:0;
      border-radius:14px;
      background:transparent;
      outline:none;
      font-size:14px;
      color:var(--text);
      transition:box-shadow .15s ease;
    }
    .field-search input{padding-left:34px;}
    .selectWrap select{
      padding-right:34px;
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
    }
    .inputWrap:focus-within, .selectWrap:focus-within{
      box-shadow:0 0 0 4px rgba(29,78,216,.13), 0 8px 20px rgba(15,23,42,.06);
      border-color:rgba(29,78,216,.35);
    }
    .filterbar .actions{
      position:relative;
      z-index:1;
      align-items:flex-end;
    }
    .filterbar .btn.ghost{
      border-radius:14px;
      border:1px solid rgba(15,23,42,.12);
      background:rgba(255,255,255,.85);
      box-shadow:0 10px 22px rgba(15,23,42,.06);
      padding:11px 16px;
      font-weight:800;
    }
    .filterbar .btn.ghost:hover{
      border-color:rgba(29,78,216,.24);
      background:#fff;
    }
    @media (max-width: 760px){
      .filterbar{
        grid-template-columns:1fr;
      }
      .leftFilters{
        grid-template-columns:1fr;
      }
      .filterbar .actions{
        justify-content:flex-end;
      }
    }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:18px;
      margin-top:18px;
    }
    @media (max-width: 980px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
    @media (max-width: 620px){ .grid{grid-template-columns: 1fr;} }

    /* Card */
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      position:relative;
      overflow:hidden;
      min-height: 230px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(600px 200px at 20% 0%, rgba(29,78,216,.08), transparent 55%),
        radial-gradient(600px 220px at 95% 10%, rgba(6,182,212,.10), transparent 55%);
      pointer-events:none;
    }
    .card:hover{
      transform: translateY(-4px);
      box-shadow: var(--shadowHover);
      border-color: rgba(29,78,216,.22);
    }

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      position:relative;
      z-index:1;
    }

    /* Status tag */
    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      border:1px solid var(--border);
      background:#fff;
      white-space:nowrap;
    }
    .status .s-dot{
      width:9px;height:9px;border-radius:50%;
      box-shadow:0 0 0 3px rgba(15,23,42,.08);
    }
    .status.pending{border-color: rgba(245,158,11,.30); background: rgba(245,158,11,.10); color:#5a3a07;}
    .status.pending .s-dot{background: var(--warn); box-shadow:0 0 0 3px rgba(245,158,11,.16);}
    .status.validated{border-color: rgba(22,163,74,.25); background: rgba(22,163,74,.08); color:#14532d;}
    .status.validated .s-dot{background: var(--ok); box-shadow:0 0 0 3px rgba(22,163,74,.14);}
    .status.inprogress{border-color: rgba(6,182,212,.25); background: rgba(6,182,212,.10); color:#0e7490;}
    .status.inprogress .s-dot{background: var(--accent); box-shadow:0 0 0 3px rgba(6,182,212,.16);}
    .status.draft{border-color: rgba(100,116,139,.25); background: rgba(100,116,139,.10); color:#334155;}
    .status.draft .s-dot{background: #64748b; box-shadow:0 0 0 3px rgba(100,116,139,.12);}
    .status.rejected{border-color: rgba(239,68,68,.25); background: rgba(239,68,68,.08); color:#7f1d1d;}
    .status.rejected .s-dot{background: var(--danger); box-shadow:0 0 0 3px rgba(239,68,68,.14);}

    /* Category badge */
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      border:1px solid rgba(29,78,216,.18);
      background:rgba(29,78,216,.06);
      color:#0b2a55;
      white-space:nowrap;
    }
    .badge .dot{
      width:8px;height:8px;border-radius:50%;
      background:linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow:0 0 0 3px rgba(6,182,212,.14);
      flex:0 0 auto;
    }

    h3{margin:0; font-size:20px; position:relative; z-index:1;}
    .desc{margin:0; color:var(--muted); line-height:1.55; font-size:14.5px; position:relative; z-index:1;}

    .meta{
      display:flex; gap:10px; flex-wrap:wrap;
      color:var(--muted); font-size:12.5px; position:relative; z-index:1;
    }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.65);
    }

    .footer{
      margin-top:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      position:relative; z-index:1;
    }

    /* actions buttons inside card */
    .cardActions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .btnSmall{
      border:0;
      cursor:pointer;
      font-weight:900;
      font-size:13.5px;
      padding:9px 11px;
      border-radius:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      transition: transform .15s ease, filter .15s ease;
    }
    .btnSmall:hover{transform:translateY(-1px); filter:brightness(1.03);}
    .btnSmall:active{transform:translateY(0);}

    .btnSmall.edit{
      background:#fff;
      border:1px solid rgba(29,78,216,.20);
      color:#0b2a55;
      box-shadow:0 8px 18px rgba(15,23,42,.06);
    }
    .btnSmall.cancel{
      background:rgba(239,68,68,.10);
      border:1px solid rgba(239,68,68,.25);
      color:#7f1d1d;
      box-shadow:0 8px 18px rgba(239,68,68,.08);
    }

    .btnLink{
      border:0;
      background:linear-gradient(135deg, var(--primary), var(--accent));
      color:#fff;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:0 10px 20px rgba(29,78,216,.18);
      transition: transform .15s ease, filter .15s ease;
      white-space:nowrap;
    }
    .btnLink:hover{transform:translateY(-1px); filter:brightness(1.03);}
    .btnLink:active{transform:translateY(0);}
    .arrow{font-weight:900;}

    /* Empty state */
    .empty{
      margin-top:18px;
      background:var(--card);
      border:1px dashed rgba(15,23,42,.18);
      border-radius:var(--radius);
      padding:18px;
      color:var(--muted);
      line-height:1.5;
      display:none;
    }
    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(15,23,42,.35);
      z-index:1000;
      padding:16px;
    }
    .modal.open{display:flex;}
    .modal-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadowHover);
      width:min(640px, 100%);
      padding:16px;
    }
    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .modal-title{
      font-size:18px;
      font-weight:900;
      margin:0;
    }
    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:12px;
    }
    .modal textarea{
      width:100%;
      min-height:120px;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:14px;
      resize:vertical;
      outline:none;
    }
    .modal-success{
      display:none;
      margin-top:10px;
      border-radius:12px;
      padding:8px 10px;
      background:rgba(22,163,74,.10);
      border:1px solid rgba(22,163,74,.25);
      color:#14532d;
      font-weight:800;
      font-size:13px;
    }
      .navbar{
      position:sticky;
      top:0;
      z-index:999;
      background:#fff;
      border-bottom:1px solid rgba(15,23,42,.08);
      box-shadow:0 8px 24px rgba(15,23,42,.06);
    }
    .nav-inner{max-width:100%;margin:0;padding:10px 18px 10px 10px;display:flex;align-items:center;justify-content:space-between;gap:18px;}
    .nav-links a{padding:6px 0; border-bottom:3px solid transparent; color:#1e3a8a; font-weight:800; letter-spacing:.2px;}
    .nav-links a.active{color:#d97706; border-bottom-color:#d97706;}
    .nav-links a:hover{color:#d97706;}
    .nav-user{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:14px;
      color:#334155;
    }
    .avatar{
      width:30px;height:30px;border-radius:50%;
      background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;
      font-weight:800;color:#0f172a;
    }      .brand .ia{color:#d97706;}  </style>
<script src="navbar.js" defer></script></head>
<body>  
  <main class="container">
    <div class="topbar">
      <div>
        <h1>Mes projets</h1>
      </div>
      <div class="actions">
        <a class="btn ghost" href="ajoutProjet.html">+ Nouveau projet</a>
        <a class="btn primary" href="#" onclick="alert('Demo: tableau de bord entrepreneur'); return false;">Dashboard</a>
      </div>
    </div>

    <section class="filterbar">
      <div class="leftFilters">
        <div class="field field-search">
          <label for="q">Recherche</label>
          <div class="inputWrap">
            <span class="inputIcon">⌕</span>
            <input id="q" type="text" placeholder="Titre, categorie...">
          </div>
        </div>
        <div class="field">
          <label for="status">Statut</label>
          <div class="selectWrap">
            <select id="status">
              <option value="ALL">Tous</option>
              <option value="DRAFT">Brouillon</option>
              <option value="PENDING">En attente</option>
              <option value="VALIDATED">Valide</option>
              <option value="EN_COURS">En cours</option>
              <option value="REJECTED">Rejete</option>
            </select>
            <span class="selectIcon">▾</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" type="button" id="resetBtn">Reinitialiser</button>
      </div>
    </section>

    <section class="grid" id="grid"></section>
    <div class="empty" id="empty">
      Aucun projet ne correspond a votre recherche. Essayez un autre statut ou un autre mot-cle.
    </div>
  </main>

  <div class="modal" id="cancelModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Demande d'annulation</h3>
        <button class="btn ghost" type="button" onclick="closeCancelModal()">Fermer</button>
      </div>
      <p class="subtitle" style="margin:0 0 10px;">Expliquez la cause de la demande d'annulation.</p>
      <textarea id="cancelReason" placeholder="Ex: changement de planning, budget, etc."></textarea>
      <div class="modal-success" id="cancelSuccess">Demande d'annulation envoyee avec succes.</div>
      <div class="modal-actions">
        <button class="btn ghost" type="button" onclick="closeCancelModal()">Annuler</button>
        <button class="btn ghost" type="button" onclick="window.location.href='demandesAnnulation.html'">Voir demandes</button>
        <button class="btn primary" type="button" onclick="submitCancel()">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    let myProjects = [];

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const q = document.getElementById("q");
    const statusSel = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    const fmt = (n) => new Intl.NumberFormat("fr-TN").format(n) + " TND";

    function statusUi(s){
      switch(s){
        case "PENDING":   return { label:"En attente", cls:"pending" };
        case "VALIDATED": return { label:"Valide", cls:"validated" };
        case "REJECTED":  return { label:"Rejete", cls:"rejected" };
        case "EN_COURS":  return { label:"En cours", cls:"inprogress" };
        case "DRAFT":     return { label:"Brouillon", cls:"draft" };
        default:          return { label:s, cls:"draft" };
      }
    }

    function canCancel(status){
      return status === "PENDING" || status === "VALIDATED" || status === "EN_COURS";
    }

    function onEdit(projectId){
      window.location.href = "modifierProjet.html?id=" + encodeURIComponent(projectId);
    }

    function onPublish(projectId){
      if (!(window.javaBridge && typeof window.javaBridge.publishProjet === "function")) {
        alert("Bridge Java indisponible.");
        return;
      }
      const result = window.javaBridge.publishProjet(String(projectId));
      if (result === "OK") {
        loadFromJava();
        return;
      }
      alert(result ? result.replace("ERROR:", "") : "Erreur inconnue.");
    }

        let cancelTargetId = null;

    function onCancel(projectId){
      cancelTargetId = projectId;
      document.getElementById("cancelReason").value = "";
      document.getElementById("cancelModal").classList.add("open");
    }

    function closeCancelModal(){
      document.getElementById("cancelModal").classList.remove("open");
      cancelTargetId = null;
    }

    function submitCancel(){
      const reason = document.getElementById("cancelReason").value.trim();
      if (!reason) {
        alert("Merci d'indiquer une cause d'annulation.");
        return;
      }

      if (window.javaBridge && typeof window.javaBridge.addDemandeAnnulation === "function") {
        const result = window.javaBridge.addDemandeAnnulation(String(cancelTargetId), reason);
        if (result && result.startsWith("OK")) {
          const box = document.getElementById("cancelSuccess");
          box.style.display = "block";
          box.textContent = "Demande d'annulation envoyee avec succes.";
          setTimeout(() => {
            window.location.href = "demandesAnnulation.html";
          }, 600);
          return;
        }
        alert(result ? result.replace("ERROR:", "") : "Erreur inconnue.");
        return;
      }

      alert("Bridge Java indisponible.");
    }

    function render(list){
      if(!list.length){
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

            grid.innerHTML = list.map(p => {
        const oddPill = p.odd ? `<span class="pill">${p.odd}</span>` : "";
        const st = statusUi(p.status);
        const cancelBtn = canCancel(p.status)
          ? `<button class="btnSmall cancel" type="button" onclick="onCancel('${p.id}')">Annuler</button>`
          : "";
        const publishBtn = p.status === "DRAFT"
          ? `<button class="btnSmall edit" type="button" onclick="onPublish('${p.id}')">Publier</button>`
          : "";

        return `
          <article class="card">
            <div class="top">
              <span class="badge"><span class="dot"></span>${p.category}</span>
              <span class="status ${st.cls}"><span class="s-dot"></span>${st.label}</span>
            </div>

            <h3>${p.title}</h3>
            <p class="desc">${p.short}</p>

            <div class="meta">
              ${oddPill}
              <span class="pill">Objectif: ${fmt(p.goal)}</span>
              <span class="pill">Maj: ${p.updatedAt}</span>
            </div>

            <div class="footer">
              <span class="muted" style="font-size:12.5px;">
                ${p.status === "EN_COURS" ? "Campagne en cours avec investissements." :
                  p.status === "PENDING" ? "En cours de validation admin." :
                  p.status === "VALIDATED" ? "Visible aux investisseurs." :
                  p.status === "REJECTED" ? "Corrigez et republiez." :
                  "Non publie (brouillon)." }
              </span>

              <div class="cardActions">
                ${publishBtn}
                <button class="btnSmall edit" type="button" onclick="onEdit('${p.id}')">Modifier</button>
                ${cancelBtn}
                <a class="btnLink" href="detailsEntrepreneur.html?id=${p.id}">Voir plus <span class="arrow">-></span></a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function applyFilters(){
      const term = q.value.trim().toLowerCase();
      const st = statusSel.value;

      let filtered = myProjects.filter(p => {
        const matchesText =
          !term ||
          p.title.toLowerCase().includes(term) ||
          p.category.toLowerCase().includes(term) ||
          (p.odd || "").toLowerCase().includes(term);

        const matchesStatus = (st === "ALL") || (p.status === st);
        return matchesText && matchesStatus;
      });

      filtered.sort((a,b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
      render(filtered);
    }

    function withBridge(onReady){
      const start = Date.now();
      const timer = setInterval(() => {
        if (window.javaBridge) {
          clearInterval(timer);
          onReady(window.javaBridge);
          return;
        }
        if (Date.now() - start > 2000) {
          clearInterval(timer);
        }
      }, 100);
    }

    function loadFromJava(){
      withBridge((bridge) => {
        const hasMy = typeof bridge.listMyProjets === "function";
        const hasAll = typeof bridge.listProjets === "function";
        if (!hasMy && !hasAll) {
          return;
        }
        try {
          const json = hasMy ? bridge.listMyProjets() : bridge.listProjets();
          myProjects = JSON.parse(json || "[]");
          applyFilters();
        } catch (e) {
          myProjects = [];
          applyFilters();
        }
      });
    }

    q.addEventListener("input", applyFilters);
    statusSel.addEventListener("change", applyFilters);
    resetBtn.addEventListener("click", () => {
      q.value = "";
      statusSel.value = "ALL";
      applyFilters();
    });

    loadFromJava();
  </script>
  <script>
    (function(){
      const links = Array.from(document.querySelectorAll('.nav-links a'));
      if (!links.length) return;
      const file = (window.location.href.split('#')[0].split('?')[0].split('/').pop() || '');
      let active = null;
      if (file === 'projet_view.html') {
        active = links.find(a => a.textContent.toLowerCase().includes('mes projets')) || links[0];
      } else {
        active = links.find(a => a.getAttribute('href') === file) || null;
      }
      if (active) active.classList.add('active');
    })();
  </script></body>
</html>
