<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investra - Accueil Investisseur</title>
  <script src="navbar.js" defer></script>
  <style>
    :root{
      --bg:#f6f8fc;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:rgba(15,23,42,.10);
      --shadow:0 14px 35px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
    }
    .container{max-width:1120px;margin:28px auto 60px;padding:0 16px}
    .topbar{margin-bottom:14px}
    h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.2px}
    .subtitle{margin:8px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5}
    .emptyCard{
      margin-top:14px;
      background:var(--card);
      border:1px dashed rgba(15,23,42,.20);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px 20px;
      text-align:center;
      color:var(--muted);
      line-height:1.6;
      font-size:15px;
      font-weight:700;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <h1>Accueil investisseur</h1>
      <p class="subtitle">Page vide pour le moment.</p>
    </div>
    <section class="emptyCard">
      Aucun contenu sur cette page pour l'instant.
      <br>
      Consultez la page <b>Projets</b> pour voir la liste des projets.
    </section>
  </main>
</body>
</html>
