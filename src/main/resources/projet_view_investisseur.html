<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Investia — Projets (Investisseur)</title>
    <script src="navbar.js" defer></script>
    <style>
        :root{
            --bg:#f6f8fc;
            --card:#ffffff;
            --text:#0f172a;
            --muted:#64748b;
            --border:rgba(15,23,42,.08);
            --shadow:0 14px 35px rgba(15,23,42,.08);
            --shadowHover:0 18px 45px rgba(15,23,42,.12);
            --primary:#1d4ed8;
            --accent:#06b6d4;
            --ok:#16a34a;
            --warn:#f59e0b;
            --danger:#ef4444;
            --radius:18px;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background:var(--bg);
            color:var(--text);
        }
        a{color:inherit; text-decoration:none}
        .container{max-width:1120px; margin:28px auto 60px; padding:0 16px;}

        .topbar{margin-bottom:14px}
        h1{margin:0; font-size:34px; font-weight:900; letter-spacing:.2px;}
        .subtitle{margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.5;}

        .filterbar{
            margin-top:18px;
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:14px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:center;
            justify-content:space-between;
        }
        .leftFilters{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            align-items:center;
        }
        .field{
            display:flex;
            flex-direction:column;
            gap:6px;
            min-width: 280px;
        }
        label{
            font-size:12px;
            font-weight:900;
            letter-spacing:.25px;
            text-transform:uppercase;
            color:#0b2a55;
        }
        input, select{
            width:100%;
            padding:10px 12px;
            border:1px solid var(--border);
            border-radius:14px;
            background:#fff;
            outline:none;
            font-size:14px;
            transition:border-color .15s ease, box-shadow .15s ease;
        }
        input:focus, select:focus{
            border-color: rgba(29,78,216,.35);
            box-shadow: 0 0 0 4px rgba(29,78,216,.10);
        }

        .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
        .btn{
            border:0; cursor:pointer;
            font-weight:900; font-size:14px;
            padding:10px 14px; border-radius:12px;
            display:inline-flex; align-items:center; gap:8px;
            background:#fff;
            border:1px solid var(--border);
            transition: transform .15s ease, filter .15s ease;
        }
        .btn:hover{transform:translateY(-1px); filter:brightness(1.02);}
        .btn:active{transform:translateY(0);}

        .grid{
            display:grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap:18px;
            margin-top:18px;
        }
        @media (max-width: 980px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
        @media (max-width: 620px){ .grid{grid-template-columns: 1fr;} }

        .card{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:18px;
            display:flex;
            flex-direction:column;
            gap:12px;
            position:relative;
            overflow:hidden;
            min-height: 230px;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .card::before{
            content:"";
            position:absolute; inset:0;
            background:
                    radial-gradient(600px 200px at 20% 0%, rgba(29,78,216,.08), transparent 55%),
                    radial-gradient(600px 220px at 95% 10%, rgba(6,182,212,.10), transparent 55%);
            pointer-events:none;
        }
        .card:hover{
            transform: translateY(-4px);
            box-shadow: var(--shadowHover);
            border-color: rgba(29,78,216,.22);
        }

        .top{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:10px;
            position:relative;
            z-index:1;
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:7px 10px;
            border-radius:999px;
            font-size:12px;
            font-weight:800;
            border:1px solid rgba(29,78,216,.18);
            background:rgba(29,78,216,.06);
            color:#0b2a55;
            white-space:nowrap;
        }
        .badge .dot{
            width:8px;height:8px;border-radius:50%;
            background:linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow:0 0 0 3px rgba(6,182,212,.14);
            flex:0 0 auto;
        }

        .status{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:7px 10px;
            border-radius:999px;
            font-size:12px;
            font-weight:900;
            border:1px solid var(--border);
            background:#fff;
            white-space:nowrap;
        }
        .status .s-dot{width:9px;height:9px;border-radius:50%; box-shadow:0 0 0 3px rgba(15,23,42,.08);}
        .status.pending{border-color: rgba(245,158,11,.30); background: rgba(245,158,11,.10); color:#5a3a07;}
        .status.pending .s-dot{background: var(--warn); box-shadow:0 0 0 3px rgba(245,158,11,.16);}
        .status.validated{border-color: rgba(22,163,74,.25); background: rgba(22,163,74,.08); color:#14532d;}
        .status.validated .s-dot{background: var(--ok); box-shadow:0 0 0 3px rgba(22,163,74,.14);}
        .status.draft{border-color: rgba(100,116,139,.25); background: rgba(100,116,139,.10); color:#334155;}
        .status.draft .s-dot{background: #64748b; box-shadow:0 0 0 3px rgba(100,116,139,.12);}
        .status.rejected{border-color: rgba(239,68,68,.25); background: rgba(239,68,68,.08); color:#7f1d1d;}
        .status.rejected .s-dot{background: var(--danger); box-shadow:0 0 0 3px rgba(239,68,68,.14);}

        h3{margin:0; font-size:22px; position:relative; z-index:1;}
        .desc{margin:0; color:var(--muted); line-height:1.55; font-size:14.5px; position:relative; z-index:1;}

        .meta{
            display:flex; gap:10px; flex-wrap:wrap;
            color:var(--muted); font-size:12.5px; position:relative; z-index:1;
        }
        .pill{
            padding:6px 10px;
            border-radius:999px;
            border:1px solid var(--border);
            background: rgba(255,255,255,.65);
        }

        .footer{
            margin-top:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            position:relative; z-index:1;
        }

        .btnLink{
            border:0;
            background:linear-gradient(135deg, var(--primary), var(--accent));
            color:#fff;
            padding:10px 14px;
            border-radius:12px;
            cursor:pointer;
            font-weight:900;
            font-size:14px;
            display:inline-flex;
            align-items:center;
            gap:8px;
            box-shadow:0 10px 20px rgba(29,78,216,.18);
            transition: transform .15s ease, filter .15s ease;
            white-space:nowrap;
        }
        .btnLink:hover{transform:translateY(-1px); filter:brightness(1.03);}
        .btnLink:active{transform:translateY(0);}
        .arrow{font-weight:900;}

        .empty{
            margin-top:18px;
            background:var(--card);
            border:1px dashed rgba(15,23,42,.18);
            border-radius:var(--radius);
            padding:18px;
            color:var(--muted);
            line-height:1.5;
            display:none;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="topbar">
        <h1>Projets</h1>
        <p class="subtitle">Liste des projets disponibles.</p>
    </div>

    <section class="filterbar">
        <div class="leftFilters">
            <div class="field">
                <label for="q">Recherche</label>
                <input id="q" type="text" placeholder="Titre, secteur…">
            </div>
            <div class="field" style="min-width:220px">
                <label for="status">Statut</label>
                <select id="status">
                    <option value="ALL">Tous</option>
                    <option value="VALIDATED">Validé</option>
                    <option value="PENDING">En attente</option>
                    <option value="DRAFT">Brouillon</option>
                    <option value="REJECTED">Rejeté</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button class="btn" type="button" id="refreshBtn">Rafraîchir</button>
            <button class="btn" type="button" id="resetBtn">Réinitialiser</button>
        </div>
    </section>

    <section class="grid" id="grid"></section>

    <div class="empty" id="empty">
        Aucun projet ne correspond à votre recherche.
    </div>
</main>

<script>
    let projects = [];

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const q = document.getElementById("q");
    const statusSel = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    const fmt = (n) => new Intl.NumberFormat("fr-TN").format(n) + " TND";

    function statusUi(s){
        switch(s){
            case "PENDING":   return { label:"En attente", cls:"pending" };
            case "VALIDATED": return { label:"Validé", cls:"validated" };
            case "REJECTED":  return { label:"Rejeté", cls:"rejected" };
            case "DRAFT":     return { label:"Brouillon", cls:"draft" };
            default:          return { label:s, cls:"draft" };
        }
    }

    /* ✅ AJOUTÉ (tu l’avais oublié) */
    function setPid(id){
        try{
            const b = window.javaBridge || window.javaBridgeInvest || window.javaBridgeInvestissement;
            if (b && b.setSelectedProjetId) b.setSelectedProjetId(String(id));
        }catch(e){}
    }

    function render(list){
        if(!list.length){
            grid.innerHTML = "";
            empty.style.display = "block";
            return;
        }
        empty.style.display = "none";

        grid.innerHTML = list.map(p => {
            const st = statusUi(p.status);

            // ✅ bouton détails investisseur
            const detailsUrl = "detailsInvestisseur.html?id=" + encodeURIComponent(p.id);

            return `
          <article class="card">
            <div class="top">
              <span class="badge"><span class="dot"></span>${p.category || ""}</span>
              <span class="status ${st.cls}"><span class="s-dot"></span>${st.label}</span>
            </div>

            <h3>${p.title || ""}</h3>
            <p class="desc">${p.short || ""}</p>

            <div class="meta">
              <span class="pill">Objectif: ${fmt(Number(p.goal || 0))}</span>
              <span class="pill">Màj: ${p.updatedAt || ""}</span>
            </div>

            <div class="footer">
              <span class="muted" style="font-size:12.5px;">
                ${p.status === "VALIDATED" ? "Projet validé et visible." :
                p.status === "PENDING" ? "En attente de validation admin." :
                    p.status === "REJECTED" ? "Projet rejeté." :
                        "Projet brouillon."}
              </span>

              <a class="btnLink" href="${detailsUrl}" onclick="setPid('${p.id}')">
                Voir détails <span class="arrow">→</span>
              </a>

            </div>
          </article>
        `;
        }).join("");
    }

    function applyFilters(){
        const term = q.value.trim().toLowerCase();
        const st = statusSel.value;

        let filtered = projects.filter(p => {
            const title = (p.title || "").toLowerCase();
            const cat = (p.category || "").toLowerCase();
            const matchesText = !term || title.includes(term) || cat.includes(term);
            const matchesStatus = (st === "ALL") || (p.status === st);
            return matchesText && matchesStatus;
        });

        filtered.sort((a,b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
        render(filtered);
    }

    function getBridge(){
        return window.javaBridge || window.javaBridgeInvest || window.javaBridgeInvestissement || null;
    }

    function withBridge(onReady, retries = 20){
        const t = setInterval(() => {
            const b = getBridge();
            const ready = (window.__bridgeReady === true);
            if (b && ready) {
                clearInterval(t);
                onReady(b);
                return;
            }
            if (--retries <= 0) {
                clearInterval(t);
            }
        }, 120);
    }

    function loadProjects(retry = 6){
        withBridge((bridge) => {
            if (!bridge || !bridge.listProjets) {
                if (retry > 0) setTimeout(() => loadProjects(retry - 1), 300);
                return;
            }
            try {
                const json = bridge.listProjets();
                const list = JSON.parse(json || "[]");
                if (!list.length && retry > 0) {
                    setTimeout(() => loadProjects(retry - 1), 300);
                    return;
                }
                projects = list;
                applyFilters();
            } catch (e) {
                if (retry > 0) setTimeout(() => loadProjects(retry - 1), 300);
                else {
                    projects = [];
                    applyFilters();
                }
            }
        }, 20);
    }

    q.addEventListener("input", applyFilters);
    statusSel.addEventListener("change", applyFilters);
    resetBtn.addEventListener("click", () => {
        q.value = "";
        statusSel.value = "ALL";
        applyFilters();
    });
    refreshBtn.addEventListener("click", loadProjects);

    loadProjects();

    window.addEventListener("pageshow", () => loadProjects());
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadProjects();
    });
</script>
</body>
</html>
