<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investia - Assistant IA</title>
  <script src="navbar.js" defer></script>
  <style>
    :root{
      --bg:#eef3fb;
      --panel:#ffffff;
      --text:#0f172a;
      --muted:#5b6b82;
      --line:rgba(15,23,42,.12);
      --blue:#1e3a8a;
      --blue-soft:#e8eefc;
      --gold:#f4b400;
      --gold-soft:#fff4d6;
      --shadow:0 16px 36px rgba(11, 26, 58, .12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at -10% 0%, rgba(29,78,216,.11), transparent 60%),
        radial-gradient(1000px 560px at 120% 10%, rgba(244,180,0,.12), transparent 58%),
        var(--bg);
    }
    .wrap{
      max-width:980px;
      margin:22px auto 40px;
      padding:0 16px;
    }
    .hero{
      border:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#fbfdff);
      border-radius:18px;
      padding:18px 20px;
      box-shadow:var(--shadow);
    }
    .hero h1{
      margin:0;
      font-size:30px;
      font-weight:900;
      letter-spacing:.2px;
      color:#0b2a55;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .hero-icon{
      width:42px;
      height:42px;
      border-radius:10px;
      display:inline-grid;
      place-items:center;
      color:#0b2a55;
      background:linear-gradient(180deg,#ffe7a6,#ffd463);
      border:1px solid rgba(217,119,6,.35);
      box-shadow:0 8px 18px rgba(217,119,6,.18);
      font-size:18px;
    }
    .hero-icon svg{
      width:24px;
      height:24px;
      stroke:#0b2a55;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .hero p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      font-weight:600;
    }
    .panel{
      margin-top:0;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:18px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      height:620px;
      max-height:620px;
      overflow:hidden;
    }
    .chat-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#f8fbff);
    }
    .assistant-chip{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      font-size:22px;
      color:#0b2a55;
      letter-spacing:.2px;
    }
    .assistant-title{
      display:flex;
      flex-direction:column;
      line-height:1.15;
    }
    .assistant-subtitle{
      margin-top:3px;
      font-size:12px;
      font-weight:700;
      color:#7a869a;
      letter-spacing:0;
    }
    .chat-title-icon{
      width:40px;
      height:40px;
      border-radius:11px;
      display:inline-grid;
      place-items:center;
      background:linear-gradient(180deg,#ffe7a6,#ffd463);
      border:1px solid rgba(217,119,6,.35);
      box-shadow:0 6px 14px rgba(217,119,6,.18);
    }
    .chat-title-icon svg{
      width:23px;
      height:23px;
      stroke:#0b2a55;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .assistant-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      font-weight:800;
      color:#1e3a8a;
      background:linear-gradient(180deg,#eef4ff,#dfebff);
      border:1px solid #bcd0fb;
      border-radius:999px;
      padding:7px 12px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }
    .assistant-badge::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 0 3px rgba(34,197,94,.18);
    }
    .topbar-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .reset-btn{
      border:1px solid #d6dbe6;
      background:linear-gradient(180deg,#ffffff,#f7f9fd);
      color:#1f2a44;
      border-radius:12px;
      padding:7px 14px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 14px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.9);
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .reset-btn:hover{
      background:linear-gradient(180deg,#ffffff,#eef3fb);
      transform:translateY(-1px);
      box-shadow:0 10px 18px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.95);
    }
    .reset-btn:active{
      transform:translateY(0);
      box-shadow:0 4px 10px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.85);
    }
    .messages{
      flex:1;
      padding:18px 18px 10px;
      overflow:auto;
      background:
        radial-gradient(1200px 500px at 0% -20%, rgba(42,105,255,.08), transparent 55%),
        radial-gradient(900px 420px at 100% 0%, rgba(244,180,0,.10), transparent 55%),
        linear-gradient(#fff,#fff) padding-box,
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 28px,
          rgba(15,23,42,.02) 28px,
          rgba(15,23,42,.02) 29px
        ) border-box;
      scrollbar-width:thin;
      scrollbar-color:rgba(29,78,216,.35) rgba(15,23,42,.08);
    }
    .messages::-webkit-scrollbar{
      width:10px;
    }
    .messages::-webkit-scrollbar-track{
      background:rgba(15,23,42,.06);
      border-radius:999px;
    }
    .messages::-webkit-scrollbar-thumb{
      background:linear-gradient(180deg,#2d4ca6,#1e3a8a);
      border-radius:999px;
      border:2px solid rgba(255,255,255,.85);
    }
    .row{
      display:flex;
      margin:0 0 14px;
      align-items:flex-end;
      gap:8px;
      animation:messageIn .18s ease-out;
    }
    .row.user{justify-content:flex-end}
    .avatar{
      width:30px;
      height:30px;
      border-radius:999px;
      display:grid;
      place-items:center;
      font-size:12px;
      font-weight:800;
      color:#fff;
      flex:0 0 30px;
      box-shadow:0 6px 14px rgba(15,23,42,.16);
    }
    .avatar.bot{background:linear-gradient(180deg,#f5bf2c,#de9c00)}
    .avatar.user{background:linear-gradient(180deg,#2b63f0,#1847be)}
    .bubble{
      max-width:min(80%,760px);
      border-radius:16px;
      padding:12px 14px 10px;
      line-height:1.55;
      font-size:14px;
      word-break:break-word;
      box-shadow:0 8px 20px rgba(15,23,42,.08);
      border:1px solid var(--line);
      position:relative;
    }
    .row.user .bubble{
      background:linear-gradient(180deg,#2f52b3,#1e3a8a);
      color:#fff;
      border-color:#1a3277;
    }
    .row.user .bubble::after{
      content:"";
      position:absolute;
      right:-7px;
      bottom:10px;
      border-width:7px 0 7px 8px;
      border-style:solid;
      border-color:transparent transparent transparent #1e3a8a;
    }
    .row.bot .bubble{
      background:linear-gradient(180deg,#fff7de,#fff1c8);
      color:#2b2d31;
      border-color:rgba(244,180,0,.45);
      box-shadow:0 10px 22px rgba(203,152,15,.18);
    }
    .row.bot .bubble::after{
      content:"";
      position:absolute;
      left:-7px;
      bottom:10px;
      border-width:7px 8px 7px 0;
      border-style:solid;
      border-color:transparent #ffe9ac transparent transparent;
    }
    .text{
      white-space:normal;
    }
    .text p{
      margin:0 0 8px;
    }
    .text p:last-child{
      margin-bottom:0;
    }
    .text ul{
      margin:0 0 8px;
      padding-left:20px;
    }
    .text li{
      margin:2px 0;
    }
    .text strong{
      font-weight:800;
    }
    .table-wrap{
      overflow:auto;
      margin:8px 0;
      border:1px solid rgba(15,23,42,.14);
      border-radius:10px;
      background:#fffdf6;
    }
    .table-wrap table{
      width:100%;
      border-collapse:collapse;
      min-width:360px;
      font-size:13px;
    }
    .table-wrap th,.table-wrap td{
      padding:8px 10px;
      border-bottom:1px solid rgba(15,23,42,.10);
      text-align:left;
      vertical-align:top;
    }
    .table-wrap th{
      background:#fff2c9;
      font-weight:800;
    }
    .meta{
      font-size:12px;
      margin-top:6px;
      color:var(--muted);
      font-weight:700;
      opacity:.92;
    }
    .row.user .meta{
      color:rgba(255,255,255,.95);
      opacity:1;
    }
    .message-content{
      border-radius:10px;
    }
    .row.bot .message-content{
      background:rgba(255,255,255,.22);
      padding:2px 0;
    }
    @keyframes messageIn{
      from{opacity:0; transform:translateY(6px)}
      to{opacity:1; transform:translateY(0)}
    }
    .composer{
      border-top:1px solid var(--line);
      padding:12px;
      background:linear-gradient(180deg,#fbfdff,#f7faff);
      display:flex;
      gap:10px;
      align-items:flex-end;
    }
    .composer textarea{
      flex:1;
      min-height:48px;
      max-height:160px;
      resize:vertical;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      outline:none;
      font-size:14px;
      line-height:1.45;
      font-family:inherit;
      background:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    }
    .composer textarea:focus{
      border-color:#3554ad;
      box-shadow:0 0 0 3px rgba(30,58,138,.22);
    }
    .send{
      border:1px solid #1a3277;
      background:linear-gradient(180deg,#2f52b3 0%, #24469f 55%, #1e3a8a 100%);
      color:#fff;
      font-weight:800;
      border-radius:12px;
      height:48px;
      min-width:120px;
      cursor:pointer;
      padding:0 18px;
      letter-spacing:.2px;
      text-shadow:0 1px 0 rgba(0,0,0,.18);
      box-shadow:
        0 10px 20px rgba(30,58,138,.30),
        inset 0 1px 0 rgba(255,255,255,.35);
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }
    .send:hover{
      filter:brightness(1.04);
      transform:translateY(-1px) scale(1.01);
      box-shadow:
        0 12px 24px rgba(30,58,138,.36),
        inset 0 1px 0 rgba(255,255,255,.45);
    }
    .send:active{
      transform:translateY(0) scale(.995);
      box-shadow:
        0 6px 14px rgba(30,58,138,.28),
        inset 0 1px 0 rgba(255,255,255,.30);
    }
    .send:disabled{
      opacity:.6;
      cursor:not-allowed;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      padding:0 14px 12px;
    }
    .typing{
      display:inline-flex;
      align-items:center;
      gap:4px;
      vertical-align:middle;
    }
    .typing span{
      width:6px;
      height:6px;
      border-radius:50%;
      background:#8c6f1d;
      animation:bounce 1.2s infinite;
    }
    .typing span:nth-child(2){animation-delay:.15s}
    .typing span:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.4}
      40%{transform:translateY(-3px);opacity:1}
    }
    @media (max-width:720px){
      .wrap{padding:0 10px}
      .hero h1{font-size:24px}
      .panel{height:70vh; max-height:70vh}
      .bubble{max-width:92%}
      .chat-topbar{padding:10px 12px}
      .composer{flex-direction:column}
      .send{width:100%}
    }
  </style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <div class="chat-topbar">
        <div class="assistant-chip">
          <span class="chat-title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v3"></path>
              <rect x="5" y="7" width="14" height="10" rx="3"></rect>
              <circle cx="10" cy="12" r="1"></circle>
              <circle cx="14" cy="12" r="1"></circle>
              <path d="M9 16h6"></path>
            </svg>
          </span>
          <span class="assistant-title">
            Assistant IA Investia
            <span class="assistant-subtitle">Posez vos questions sur la plateforme</span>
          </span>
        </div>
      <div class="topbar-actions">
        <div class="assistant-badge">Connecte</div>
        <button id="resetBtn" class="reset-btn" type="button">Reinitialiser</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="prompt" placeholder="Exemple: Quelles sont les etapes pour publier un projet ?"></textarea>
      <button id="sendBtn" class="send" type="button">Envoyer</button>
    </div>
    <div class="hint">Appuyez sur Entree pour envoyer le message.</div>
  </section>
</main>

<script>
  const messagesEl = document.getElementById("messages");
  const promptEl = document.getElementById("prompt");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  let isSending = false;

  function nowTime() {
    const d = new Date();
    return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function escapeHtml(value) {
    return (value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderTable(lines) {
    const rows = lines
      .map((line) => line.trim())
      .filter((line) => line.startsWith("|") && line.endsWith("|"))
      .map((line) => line.slice(1, -1).split("|").map((c) => c.trim()));
    if (rows.length < 2) return "";
    const header = rows[0];
    const body = rows.slice(1).filter((r) => !r.every((c) => /^-+$/.test(c.replace(/\s/g, ""))));
    if (!body.length) return "";

    const thead = "<tr>" + header.map((h) => "<th>" + escapeHtml(h) + "</th>").join("") + "</tr>";
    const tbody = body.map((r) => "<tr>" + r.map((c) => "<td>" + escapeHtml(c) + "</td>").join("") + "</tr>").join("");
    return '<div class="table-wrap"><table><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div>";
  }

  function formatMessage(text) {
    const raw = (text || "").replace(/\r\n/g, "\n");
    const tableBlock = renderTable(raw.split("\n"));
    let clean = escapeHtml(raw);
    clean = clean.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    clean = clean.replace(/^\s*-\s+(.+)$/gm, "<li>$1</li>");
    if (clean.indexOf("<li>") !== -1) {
      clean = "<ul>" + clean + "</ul>";
      clean = clean.replace(/<\/ul>\s*<ul>/g, "");
    }
    clean = clean.split("\n\n").map(function(p) { return "<p>" + p.replace(/\n/g, "<br>") + "</p>"; }).join("");
    if (tableBlock) {
      return '<div class="text">' + clean + tableBlock + "</div>";
    }
    return '<div class="text">' + clean + "</div>";
  }

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (role === "user" ? "user" : "bot");
    avatar.textContent = role === "user" ? "" : "IA";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const content = document.createElement("div");
    content.className = "message-content";
    content.innerHTML = formatMessage(text);
    bubble.appendChild(content);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (role === "user" ? "Vous" : "Assistant") + " - " + nowTime();
    bubble.appendChild(meta);

    if (role === "bot") row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return { bubble, content };
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    promptEl.disabled = busy;
    sendBtn.textContent = busy ? "Envoi..." : "Envoyer";
  }

  function nextFrame() {
    return new Promise(function(resolve) {
      if (window.requestAnimationFrame) {
        requestAnimationFrame(function() { resolve(); });
      } else {
        setTimeout(resolve, 16);
      }
    });
  }

  async function sendMessage() {
    if (isSending) return;
    const text = (promptEl.value || "").trim();
    if (!text) return;

    addMessage("user", text);
    promptEl.value = "";
    isSending = true;
    setBusy(true);

    const waiting = addMessage("bot", "Je traite votre demande...");
    await nextFrame();
    await new Promise(function(resolve){ setTimeout(resolve, 10); });
    try {
      if (!window.javaBridge || typeof window.javaBridge.askChatbot !== "function") {
        waiting.content.innerHTML = formatMessage("Bridge indisponible. Recharge la page.");
        return;
      }
      const result = window.javaBridge.askChatbot(text);
      if (typeof result === "string" && result.startsWith("ERROR:")) {
        waiting.content.innerHTML = formatMessage(result);
      } else {
        waiting.content.innerHTML = formatMessage(result || "Aucune reponse.");
      }
    } catch (e) {
      waiting.content.innerHTML = formatMessage("Erreur: " + (e && e.message ? e.message : "UNKNOWN"));
    } finally {
      isSending = false;
      setBusy(false);
      promptEl.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  resetBtn.addEventListener("click", () => {
    messagesEl.innerHTML = "";
    addMessage("bot", "Bonjour, je suis votre assistant IA Investia. Comment puis-je vous aider ?");
    promptEl.focus();
  });
  function isEnterEvent(e) {
    const code = e.keyCode || e.which || 0;
    return e.key === "Enter" || code === 13;
  }
  function onPromptEnter(e) {
    if (!isEnterEvent(e)) return;
    e.preventDefault();
    sendMessage();
  }
  promptEl.addEventListener("keydown", onPromptEnter);

  addMessage("bot", "Bonjour, je suis votre assistant IA Investia. Comment puis-je vous aider ?");
</script>
</body>
</html>
