<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compléter profil investisseur</title>
    <style>
        :root{
            --bg:#f6f8fc; --card:#fff; --text:#0f172a; --muted:#64748b;
            --border:rgba(15,23,42,.10); --shadow:0 14px 35px rgba(15,23,42,.08);
            --radius:18px; --btn:#2563eb; --dark:#0f172a;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
        .container{max-width:960px;margin:28px auto 60px;padding:0 16px}
        h1{margin:0 0 6px;font-size:28px;font-weight:900}
        .sub{margin:0 0 18px;color:var(--muted)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        label{font-size:13px;font-weight:800}
        input, select, textarea{
            width:100%; margin-top:6px; padding:10px 12px; border-radius:12px;
            border:1px solid rgba(15,23,42,.18); outline:none; font-size:14px;
            background:#fff;
        }
        textarea{min-height:90px; resize:vertical}
        .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
        .btn{
            background:var(--btn); color:white; border:none; border-radius:12px;
            padding:10px 14px; font-weight:900; cursor:pointer;
        }
        .btn.secondary{background:var(--dark)}
        .pill{
            font-size:12px;font-weight:900;
            padding:6px 10px;border-radius:999px;
            border:1px solid rgba(15,23,42,.18);
            color:var(--muted); background:#fff;
        }
        .msg{margin-top:12px;color:var(--muted);font-weight:800}
        .err{color:#b91c1c;font-weight:900}
        .ok{color:#15803d;font-weight:900}
        @media (max-width:820px){.grid{grid-template-columns:1fr}}
    </style>
</head>

<body>
<main class="container">
    <h1>Compléter profil investisseur</h1>
    <p class="sub">Remplis ces infos + tes documents (CIN) pour finaliser ton profil.</p>

    <section class="card">
        <div class="grid">

            <div>
                <label>Budget total (TND) *</label>
                <input id="budget_total" type="number" step="0.01" placeholder="ex: 50000">
            </div>

            <div>
                <label>Budget mensuel (TND)</label>
                <input id="budget_mensuel" type="number" step="0.01" placeholder="ex: 2000">
            </div>

            <div>
                <label>Ticket moyen par projet (TND) *</label>
                <input id="ticket" type="number" step="0.01" placeholder="ex: 1000">
            </div>

            <div>
                <label>Horizon d'investissement *</label>
                <select id="horizon">
                    <option value="COURT">COURT</option>
                    <option value="MOYEN">MOYEN</option>
                    <option value="LONG">LONG</option>
                </select>
            </div>

            <div style="grid-column:1/-1">
                <label>Secteurs (CTRL pour multi) *</label>
                <select id="secteurs" multiple size="4">
                    <option value="AGRITECH">AGRITECH</option>
                    <option value="EDTECH">EDTECH</option>
                    <option value="FINTECH">FINTECH</option>
                    <option value="HEALTHTECH">HEALTHTECH</option>
                </select>
            </div>

            <div style="grid-column:1/-1">
                <label>Bio</label>
                <textarea id="bio" placeholder="Ta bio (optionnel)"></textarea>
            </div>

            <!-- DOCUMENTS -->
            <div style="grid-column:1/-1">
                <label>CIN Recto (PDF) *</label>
                <div class="row">
                    <button class="btn secondary" type="button" onclick="uploadCinRecto()">Uploader</button>
                    <span id="cinRectoState" class="pill">Non chargé</span>
                </div>
            </div>

            <div style="grid-column:1/-1">
                <label>CIN Verso (PDF) *</label>
                <div class="row">
                    <button class="btn secondary" type="button" onclick="uploadCinVerso()">Uploader</button>
                    <span id="cinVersoState" class="pill">Non chargé</span>
                </div>
            </div>

            <div style="grid-column:1/-1">
                <label>Photo (image) *</label>
                <div class="row">
                    <button class="btn secondary" type="button" onclick="uploadPhoto()">Uploader</button>
                    <span id="photoState" class="pill">Non chargé</span>
                </div>
            </div>

            <div style="grid-column:1/-1">
                <label>
                    <input id="accepte" type="checkbox">
                    J'accepte les conditions *
                </label>
            </div>

        </div>

        <!-- boutons -->
        <div class="row">
            <button class="btn secondary" id="btnBack" type="button">Retour</button>
            <button class="btn" id="btnSubmit" type="button">Valider mes informations</button>
            <button class="btn secondary" type="button" onclick="loadMe()">Charger mes infos</button>
        </div>

        <div class="msg" id="msg"></div>
    </section>
</main>

<script>
    let cinRectoUrl = "";
    let cinVersoUrl = "";
    let photoUrl = "";

    function getBridge(){
        return window.javaBridge
            || window.javaBridgeUpload
            || window.javaBridgeInvest
            || window.bridge
            || window.Bridge
            || window.app
            || null;
    }

    function selectedValues(select){
        return Array.from(select.selectedOptions).map(o => o.value);
    }

    function setState(id, ok){
        const el = document.getElementById(id);
        el.textContent = ok ? "Chargé ✅" : "Non chargé";
        el.className = "pill " + (ok ? "ok" : "");
    }

    function showErr(msg){
        document.getElementById("msg").innerHTML = "<span class='err'>" + msg + "</span>";
    }

    function showOk(msg){
        document.getElementById("msg").innerHTML = "<span class='ok'>" + msg + "</span>";
    }

    function uploadCinRecto(){
        const b = getBridge();
        if(!b || typeof b.uploadPdf !== "function"){ showErr("Bridge Java indisponible pour upload PDF."); return; }

        const res = b.uploadPdf("cin_recto");
        if(res && !String(res).startsWith("ERROR")){
            cinRectoUrl = res;
            setState("cinRectoState", true);
            showOk("✅ CIN recto chargé");
        } else {
            showErr(res || "Erreur upload CIN recto");
        }
    }

    function uploadCinVerso(){
        const b = getBridge();
        if(!b || typeof b.uploadPdf !== "function"){ showErr("Bridge Java indisponible pour upload PDF."); return; }

        const res = b.uploadPdf("cin_verso"); // ✅ FIX
        if(res && !String(res).startsWith("ERROR")){
            cinVersoUrl = res;
            setState("cinVersoState", true);
            showOk("✅ CIN verso chargé");
        } else {
            showErr(res || "Erreur upload CIN verso");
        }
    }

    function uploadPhoto(){
        const b = getBridge();
        if(!b || typeof b.uploadImage !== "function"){ showErr("Bridge Java indisponible pour upload image."); return; }

        const res = b.uploadImage("photo");
        if(res && !String(res).startsWith("ERROR")){
            photoUrl = res;
            setState("photoState", true);
            showOk("✅ Photo chargée");
        } else {
            showErr(res || "Erreur upload photo");
        }
    }

    function loadMe(){
        const b = getBridge();
        if(!b || typeof b.getProfilInvestisseurJson !== "function"){ showErr("Bridge Java indisponible (getProfilInvestisseurJson)."); return; }

        const json = b.getProfilInvestisseurJson();
        if(json === "null"){ showErr("Profil introuvable"); return; }

        try{
            const p = JSON.parse(json);

            document.getElementById("budget_total").value = p.budgetTotal ?? "";
            document.getElementById("budget_mensuel").value = p.budgetMensuel ?? "";
            document.getElementById("ticket").value = p.ticketMoyenParProjet ?? "";
            document.getElementById("horizon").value = p.horizonInvestissement ?? "COURT";
            document.getElementById("bio").value = p.bio ?? "";

            const sect = (p.secteurs || "").split(",").map(s=>s.trim()).filter(Boolean);
            const sel = document.getElementById("secteurs");
            Array.from(sel.options).forEach(o => o.selected = sect.includes(o.value));

            cinRectoUrl = p.cinRectoUrl || "";
            cinVersoUrl = p.cinVersoUrl || "";
            photoUrl = p.photoUrl || "";

            setState("cinRectoState", !!cinRectoUrl);
            setState("cinVersoState", !!cinVersoUrl);
            setState("photoState", !!photoUrl);

            showOk("✅ Infos chargées");
        }catch(e){
            showErr("Erreur JSON: " + e.message);
        }
    }

    // Retour -> login normal
    document.getElementById("btnBack").addEventListener("click", () => {
        const b = getBridge();
        if(!b || typeof b.logout !== "function"){ alert("Bridge Java indisponible."); return; }
        b.logout();
    });

    // Valider -> une seule méthode Java (pas de double navigation)
    document.getElementById("btnSubmit").addEventListener("click", () => {
        const b = getBridge();
        if(!b){ showErr("Bridge Java indisponible."); return; }

        const budgetTotal = document.getElementById("budget_total").value.trim();
        const budgetMensuel = document.getElementById("budget_mensuel").value.trim();
        const ticket = document.getElementById("ticket").value.trim();
        const horizon = document.getElementById("horizon").value;
        const secteurs = selectedValues(document.getElementById("secteurs")).join(",");
        const bio = document.getElementById("bio").value || "";
        const accepte = document.getElementById("accepte").checked ? "true" : "false";

        const fn = b.submitProfileForVerification || b.saveProfilInvestisseur;
        if(typeof fn !== "function"){
            showErr("Méthode submitProfileForVerification/saveProfilInvestisseur introuvable dans le bridge.");
            return;
        }

        const res = fn.call(b,
            budgetTotal, budgetMensuel, ticket, horizon, bio, accepte, secteurs,
            cinRectoUrl, cinVersoUrl, photoUrl
        );

        if(String(res) === "OK"){
            showOk("✅ Profil envoyé. Retour au login...");
            // ⚠️ Ne pas appeler logoutPending ici: Java le fait déjà (switchTo web_auth.fxml).
        } else {
            showErr(res || "Erreur inconnue");
        }
    });

    window.addEventListener("load", () => setTimeout(loadMe, 250));
</script>
</body>
</html>
