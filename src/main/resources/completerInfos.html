<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investia - Completer vos informations</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:rgba(15,23,42,.12);
      --primary:#0b2a55;
      --primary2:#12418a;
      --ok:#166534;
      --err:#991b1b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
              radial-gradient(800px 320px at 10% 0%, rgba(18,65,138,.12), transparent 60%),
              radial-gradient(900px 360px at 100% 0%, rgba(11,42,85,.10), transparent 60%),
              var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:900px;
      margin:34px auto;
      padding:0 16px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:0 18px 40px rgba(15,23,42,.10);
      padding:20px;
    }
    .back-btn{
      border:1px solid var(--border);
      background:#fff;
      color:#0b2a55;
      border-radius:10px;
      padding:6px 10px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      margin-bottom:10px;
    }
    .back-btn:hover{
      background:#eff6ff;
      border-color:#93c5fd;
    }
    h1{
      margin:0 0 8px;
      color:var(--primary);
      font-size:30px;
    }
    p{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.55;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .span2{grid-column:span 2;}
    @media (max-width:800px){
      .grid{grid-template-columns:1fr;}
      .span2{grid-column:span 1;}
    }
    label{
      display:block;
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.3px;
      color:#1e3a8a;
    }
    input, textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:11px 12px;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    textarea{min-height:90px; resize:vertical;}
    input:focus, textarea:focus{
      border-color:rgba(18,65,138,.45);
      box-shadow:0 0 0 4px rgba(18,65,138,.12);
    }
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:6px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid var(--border);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:700;
      background:#fff;
      cursor:pointer;
      transition:all .15s ease;
    }
    .chip.selected{
      background:#dbeafe;
      border-color:#2563eb;
      color:#1e3a8a;
      box-shadow:0 0 0 3px rgba(37,99,235,.10);
    }
    .hidden{display:none;}
    .actions{
      margin-top:14px;
      display:flex;
      justify-content:flex-end;
      gap:8px;
    }
    .pdf-picker{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .file-picker{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .date-picker{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .calendar-overlay{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:3000;
      padding:14px;
    }
    .calendar-overlay.open{display:flex;}
    .calendar-box{
      width:min(360px,100%);
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(15,23,42,.18);
      padding:12px;
    }
    .calendar-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
      gap:8px;
    }
    .calendar-title{
      display:flex;
      align-items:center;
      gap:8px;
      flex:1;
    }
    .calendar-select{
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff;
      padding:6px 8px;
      font-weight:700;
      color:#0b2a55;
    }
    .calendar-nav{
      border:1px solid var(--border);
      background:#fff;
      border-radius:10px;
      width:34px;
      height:34px;
      cursor:pointer;
      font-weight:900;
      color:#1e3a8a;
    }
    .calendar-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
    }
    .calendar-dow{
      text-align:center;
      font-size:11px;
      font-weight:800;
      color:#64748b;
      padding:6px 0;
    }
    .calendar-day{
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff;
      height:34px;
      cursor:pointer;
      font-weight:700;
      color:#0f172a;
    }
    .calendar-day.muted{opacity:.35; cursor:default;}
    .calendar-day.selected{
      background:#1d4ed8;
      border-color:#1d4ed8;
      color:#fff;
      font-weight:900;
    }
    .calendar-foot{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:10px;
    }
    .pdf-picker input[readonly]{
      background:#f8fafc;
    }
    .file-picker input[readonly]{
      background:#f8fafc;
    }
    .date-picker input{
      flex:1;
    }
    .btn.secondary{
      color:#0b2a55;
      background:#e2e8f0;
    }
    .btn{
      border:0;
      border-radius:12px;
      padding:11px 14px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.primary{
      color:#fff;
      background:linear-gradient(135deg, var(--primary2), var(--primary));
    }
    .alert{
      display:none;
      margin-top:12px;
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
      font-weight:700;
    }
    .alert.ok{display:none; color:var(--ok); background:rgba(22,101,52,.10); border:1px solid rgba(22,101,52,.25);}
    .alert.err{display:none; color:var(--err); background:rgba(153,27,27,.10); border:1px solid rgba(153,27,27,.25);}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <button class="back-btn" type="button" onclick="goBackToLogin()">Retour</button>
    <h1>Completer vos informations</h1>
    <p>
      Cette etape est obligatoire lors de votre premiere connexion.
      Votre dossier sera envoye a l'administrateur pour verification.
    </p>

    <form id="profileForm" novalidate>
      <div class="grid">
        <div>
          <label for="dateNaissance">Date naissance</label>
          <div class="date-picker">
            <input id="dateNaissance" type="text" readonly placeholder="YYYY-MM-DD" />
          </div>
        </div>
        <div>
          <label for="nationalite">Nationalite</label>
          <input id="nationalite" placeholder="Ex: Tunisienne" />
        </div>
        <div>
          <label for="ville">Ville</label>
          <input id="ville" placeholder="Ex: Sfax" />
        </div>
        <div>
          <label for="photoUrl">Photo profil</label>
          <input id="photoUrl" type="hidden" />
          <div class="file-picker">
            <input id="photoUrlDisplay" readonly placeholder="Aucune image selectionnee" />
            <button class="btn secondary" type="button" onclick="pickImage('photoUrl','photoUrlDisplay','photo_profil')">Charger image</button>
          </div>
        </div>
        <div class="span2">
          <label for="adresse">Adresse *</label>
          <input id="adresse" required placeholder="Adresse complete" />
        </div>
        <div>
          <label for="rib">RIB *</label>
          <input id="rib" required maxlength="34" placeholder="RIB" />
          <div style="margin-top:6px; font-size:12px; color:#64748b;">
            Format: 10 a 34 chiffres (0-9), sans lettres.
          </div>
        </div>
        <div>
          <label for="cinRectoUrl">CIN recto PDF *</label>
          <input id="cinRectoUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="cinRectoUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('cinRectoUrl','cinRectoUrlDisplay','cin_recto')">Charger PDF</button>
          </div>
        </div>
        <div>
          <label for="cinVersoUrl">CIN verso PDF *</label>
          <input id="cinVersoUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="cinVersoUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('cinVersoUrl','cinVersoUrlDisplay','cin_verso')">Charger PDF</button>
          </div>
        </div>
        <div>
          <label for="justificatifDomicileUrl">Justificatif domicile PDF *</label>
          <input id="justificatifDomicileUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="justificatifDomicileUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('justificatifDomicileUrl','justificatifDomicileUrlDisplay','justificatif_domicile')">Charger PDF</button>
          </div>
        </div>
        <div class="span2">
          <label for="bio">Bio</label>
          <textarea id="bio" placeholder="Presentation de votre activite"></textarea>
        </div>
        <div>
          <label for="registreCommerceUrl">Registre commerce PDF</label>
          <input id="registreCommerceUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="registreCommerceUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('registreCommerceUrl','registreCommerceUrlDisplay','registre_commerce')">Charger PDF</button>
          </div>
        </div>
        <div>
          <label for="patenteUrl">Patente PDF</label>
          <input id="patenteUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="patenteUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('patenteUrl','patenteUrlDisplay','patente')">Charger PDF</button>
          </div>
        </div>
        <div>
          <label for="matriculeFiscalUrl">Matricule fiscal PDF</label>
          <input id="matriculeFiscalUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="matriculeFiscalUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('matriculeFiscalUrl','matriculeFiscalUrlDisplay','matricule_fiscal')">Charger PDF</button>
          </div>
        </div>
        <div>
          <label for="carteFiscaleUrl">Carte fiscale PDF</label>
          <input id="carteFiscaleUrl" type="hidden" />
          <div class="pdf-picker">
            <input id="carteFiscaleUrlDisplay" readonly placeholder="Aucun fichier selectionne" />
            <button class="btn secondary" type="button" onclick="pickPdf('carteFiscaleUrl','carteFiscaleUrlDisplay','carte_fiscale')">Charger PDF</button>
          </div>
        </div>
        <div class="span2">
          <label>Secteurs</label>
          <div class="chips" id="secteursGroup">
            <label class="chip"><input type="checkbox" value="AGRITECH"> AGRITECH</label>
            <label class="chip"><input type="checkbox" value="EDTECH"> EDTECH</label>
            <label class="chip"><input type="checkbox" value="FINTECH"> FINTECH</label>
            <label class="chip"><input type="checkbox" value="HEALTHTECH"> HEALTHTECH</label>
            <label class="chip"><input type="checkbox" value="GREENTECH"> GREENTECH</label>
            <label class="chip"><input type="checkbox" value="INDUSTRIE"> INDUSTRIE</label>
            <label class="chip"><input type="checkbox" value="SERVICES"> SERVICES</label>
            <label class="chip"><input id="secteurAutre" type="checkbox" value="AUTRE" onchange="toggleAutreInput()"> AUTRE</label>
          </div>
          <div id="autreSecteurWrap" class="hidden" style="margin-top:10px;">
            <label for="autreSecteur">Precisez autre secteur *</label>
            <input id="autreSecteur" placeholder="Ex: LOGISTIQUE" />
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" type="submit">Valider mes informations</button>
      </div>

      <div id="okBox" class="alert ok"></div>
      <div id="errBox" class="alert err"></div>
    </form>
  </section>
</main>
<div class="calendar-overlay" id="birthCalendarOverlay">
  <div class="calendar-box">
    <div class="calendar-head">
      <div class="calendar-title">
        <select id="calMonthSelect" class="calendar-select"></select>
        <select id="calYearSelect" class="calendar-select"></select>
      </div>
    </div>
    <div class="calendar-grid" id="calDowRow"></div>
    <div class="calendar-grid" id="calDaysGrid"></div>
    <div class="calendar-foot">
      <button class="btn secondary" type="button" id="calTodayBtn">Aujourd hui</button>
      <button class="btn secondary" type="button" id="calCloseBtn">Fermer</button>
    </div>
  </div>
</div>
<script>
  const form = document.getElementById("profileForm");
  const okBox = document.getElementById("okBox");
  const errBox = document.getElementById("errBox");
  const autreCheckbox = document.getElementById("secteurAutre");
  const autreSecteurWrap = document.getElementById("autreSecteurWrap");
  const autreSecteurInput = document.getElementById("autreSecteur");
  const secteurInputs = Array.from(document.querySelectorAll('#secteursGroup input[type="checkbox"]'));

  function showOk(msg){
    okBox.textContent = msg;
    okBox.style.display = "block";
    errBox.style.display = "none";
  }
  function showErr(msg){
    errBox.textContent = msg;
    errBox.style.display = "block";
    okBox.style.display = "none";
  }
  function getBridge(){
    return window.javaBridge
            || window.javaBridgeUpload
            || window.javaBridgeInvest
            || window.app
            || window.Bridge
            || null;
  }

  function bridgeOk(){
    const b = getBridge();
    return !!b;
  }
  function withBridge(onReady, onFail){
    const start = Date.now();
    const timer = setInterval(() => {
      if (window.javaBridge) {
        clearInterval(timer);
        onReady(window.javaBridge);
        return;
      }
      if (Date.now() - start > 2500) {
        clearInterval(timer);
        if (onFail) onFail();
      }
    }, 100);
  }
  function getSecteursCsv(){
    const checks = Array.from(document.querySelectorAll("#secteursGroup input[type=checkbox]:checked"));
    return checks.map(c => c.value).join(",");
  }
  function normalizeRib(value){
    return (value || "").replace(/\s+/g, "").trim();
  }
  function isValidRib(value){
    const rib = normalizeRib(value);
    return /^[0-9]{10,34}$/.test(rib);
  }
  function getPdfStoredPath(id){
    const el = document.getElementById(id);
    if (!el) return "";
    return (el.value || "").trim();
  }
  function getDisplayFileName(path){
    if (!path) return "";
    const normalized = path.split("\\").join("/");
    const idx = normalized.lastIndexOf("/");
    return idx >= 0 ? normalized.substring(idx + 1) : normalized;
  }
  function isPdfName(name){
    return !!name && name.toLowerCase().endsWith(".pdf");
  }
  function pickPdf(targetInputId, displayInputId, docType){
    const bridge = getBridge();
    if (!bridge || typeof bridge.uploadPdf !== "function") {
      showErr("Bridge Java indisponible pour upload PDF.");
      return;
    }
    const res = bridge.uploadPdf(docType);
    if (!res) return;
    if (res.startsWith("ERROR:")) {
      showErr(res.replace("ERROR:", ""));
      return;
    }
    document.getElementById(targetInputId).value = res;
    document.getElementById(displayInputId).value = getDisplayFileName(res);
    showOk("PDF charge avec succes.");
  }
  window.pickPdf = pickPdf;
  function pickImage(targetInputId, displayInputId, docType){
    const bridge = getBridge();
    if (!bridge || typeof bridge.uploadImage !== "function") {
      showErr("Bridge Java indisponible pour upload image.");
      return;
    }
    const res = bridge.uploadImage(docType);
    if (!res) return;
    if (res.startsWith("ERROR:")) {
      showErr(res.replace("ERROR:", ""));
      return;
    }
    document.getElementById(targetInputId).value = res;
    document.getElementById(displayInputId).value = getDisplayFileName(res);
    showOk("Image chargee avec succes.");
  }
  window.pickImage = pickImage;
  const birthInput = document.getElementById("dateNaissance");
  const calOverlay = document.getElementById("birthCalendarOverlay");
  const calMonthSelect = document.getElementById("calMonthSelect");
  const calYearSelect = document.getElementById("calYearSelect");
  const calDowRow = document.getElementById("calDowRow");
  const calDaysGrid = document.getElementById("calDaysGrid");
  const calTodayBtn = document.getElementById("calTodayBtn");
  const calCloseBtn = document.getElementById("calCloseBtn");
  const DOW = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const MONTHS = ["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
  let calViewDate = new Date();

  function toIsoDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function parseIsoDate(v){
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    const [y,m,d] = v.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return dt;
  }
  function startOfCalendarGrid(view){
    const first = new Date(view.getFullYear(), view.getMonth(), 1);
    const day = (first.getDay() + 6) % 7;
    first.setDate(first.getDate() - day);
    return first;
  }
  function renderBirthCalendar(){
    calMonthSelect.innerHTML = MONTHS.map((m, idx) => `<option value="${idx}">${m}</option>`).join("");
    const thisYear = new Date().getFullYear();
    const minYear = thisYear - 100;
    const maxYear = thisYear + 1;
    const years = [];
    for (let y = minYear; y <= maxYear; y++) years.push(y);
    calYearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
    calMonthSelect.value = String(calViewDate.getMonth());
    calYearSelect.value = String(calViewDate.getFullYear());
    calDowRow.innerHTML = DOW.map(d => `<div class="calendar-dow">${d}</div>`).join("");
    const selected = parseIsoDate((birthInput.value || "").trim());
    const gridStart = startOfCalendarGrid(calViewDate);
    const items = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const inMonth = d.getMonth() === calViewDate.getMonth();
      const isSelected = selected && toIsoDate(d) === toIsoDate(selected);
      items.push(`<button type="button" class="calendar-day${inMonth ? "" : " muted"}${isSelected ? " selected" : ""}" data-date="${toIsoDate(d)}" ${inMonth ? "" : "tabindex=\"-1\""}>${d.getDate()}</button>`);
    }
    calDaysGrid.innerHTML = items.join("");
    calDaysGrid.querySelectorAll(".calendar-day").forEach(btn => {
      if (btn.classList.contains("muted")) return;
      btn.addEventListener("click", () => {
        birthInput.value = btn.dataset.date;
        closeBirthCalendar();
      });
    });
  }
  function openBirthCalendar(){
    const existing = parseIsoDate((birthInput.value || "").trim());
    calViewDate = existing || new Date();
    renderBirthCalendar();
    calOverlay.classList.add("open");
  }
  function closeBirthCalendar(){
    calOverlay.classList.remove("open");
  }
  window.openBirthCalendar = openBirthCalendar;
  birthInput.addEventListener("click", openBirthCalendar);
  birthInput.addEventListener("focus", openBirthCalendar);
  calMonthSelect.addEventListener("change", () => {
    calViewDate = new Date(calViewDate.getFullYear(), Number(calMonthSelect.value), 1);
    renderBirthCalendar();
  });
  calYearSelect.addEventListener("change", () => {
    calViewDate = new Date(Number(calYearSelect.value), calViewDate.getMonth(), 1);
    renderBirthCalendar();
  });
  calTodayBtn.addEventListener("click", () => {
    const now = new Date();
    birthInput.value = toIsoDate(now);
    calViewDate = new Date(now.getFullYear(), now.getMonth(), 1);
    renderBirthCalendar();
  });
  calCloseBtn.addEventListener("click", closeBirthCalendar);
  calOverlay.addEventListener("click", (e) => {
    if (e.target === calOverlay) closeBirthCalendar();
  });
  function goBackToLogin(){
    const bridge = getBridge();
    try {
      if (bridge && typeof bridge.logout === "function") {
        const out = bridge.logout();
        if (!out || out === "OK") return;
      }
    } catch (e) {}
    window.location.href = "login.html";
    setTimeout(() => {
      if (window.location.href.indexOf("login.html") === -1) {
        window.location.href = "html/login.html";
      }
    }, 200);
  }
  window.goBackToLogin = goBackToLogin;

  function validatePdfInputs(){
    const requiredIds = ["cinRectoUrl", "cinVersoUrl", "justificatifDomicileUrl"];
    for (const id of requiredIds) {
      const name = getPdfStoredPath(id);
      if (!isPdfName(name)) return false;
    }
    const optionalIds = ["registreCommerceUrl", "patenteUrl", "matriculeFiscalUrl", "carteFiscaleUrl"];
    for (const id of optionalIds) {
      const name = getPdfStoredPath(id);
      if (name && !isPdfName(name)) return false;
    }
    return true;
  }
  function isAutreChecked(){
    return !!(autreCheckbox && autreCheckbox.checked);
  }
  function toggleAutreInput(){
    if (!autreSecteurWrap || !autreSecteurInput) return;
    const show = isAutreChecked();
    autreSecteurWrap.classList.toggle("hidden", !show);
    autreSecteurWrap.style.display = show ? "block" : "none";
    autreSecteurInput.required = show;
    if (!show) autreSecteurInput.value = "";
  }
  window.toggleAutreInput = toggleAutreInput;

  function refreshSecteurStyles(){
    secteurInputs.forEach((input) => {
      const chip = input.closest(".chip");
      if (!chip) return;
      chip.classList.toggle("selected", input.checked);
    });
  }

  secteurInputs.forEach((input) => {
    input.addEventListener("change", () => {
      refreshSecteurStyles();
      if (input.value === "AUTRE") toggleAutreInput();
    });
  });
  if (autreCheckbox) {
    autreCheckbox.addEventListener("change", toggleAutreInput);
    toggleAutreInput();
  }
  refreshSecteurStyles();

  let cachedCurrent = { user: null, profil: null };
  function loadCurrentUserAndProfil(){
    withBridge((bridge) => {
      if (typeof bridge.getCurrentUserWithProfil !== "function") return;
      try {
        const payload = JSON.parse(bridge.getCurrentUserWithProfil() || "{}");
        cachedCurrent = payload || { user: null, profil: null };
        const u = cachedCurrent.user || {};
        const p = cachedCurrent.profil || {};
        if (u.dateNaissance) document.getElementById("dateNaissance").value = String(u.dateNaissance).slice(0, 10);
        document.getElementById("nationalite").value = u.nationalite || "";
        document.getElementById("ville").value = u.ville || "";
        document.getElementById("photoUrl").value = p.photoUrl || "";
        document.getElementById("photoUrlDisplay").value = p.photoUrl ? getDisplayFileName(p.photoUrl) : "";
      } catch (e) {
        cachedCurrent = { user: null, profil: null };
      }
    }, () => {});
  }
  try { loadCurrentUserAndProfil(); } catch (e) {}

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      showErr("Veuillez remplir les champs obligatoires.");
      return;
    }
    if (isAutreChecked() && !autreSecteurInput.value.trim()) {
      showErr("Veuillez preciser le secteur 'AUTRE'.");
      return;
    }
    if (!isValidRib(document.getElementById("rib").value)) {
      showErr("RIB invalide. Utilisez uniquement des chiffres (10 a 34).");
      return;
    }
    if (!validatePdfInputs()) {
      showErr("Veuillez charger uniquement des fichiers PDF.");
      return;
    }

    const bridge = getBridge();
    if (!bridge || typeof bridge.submitProfileForVerification !== "function") {
      showErr("Bridge Java indisponible.");
      return;
    }

    if (typeof bridge.updateCurrentUserAndProfil === "function") {
      const u = cachedCurrent.user || {};
      const updateRes = bridge.updateCurrentUserAndProfil(
              (u.nom || "").trim(),
              (u.prenom || "").trim(),
              (u.telephone || "").trim(),
              (u.cin || "").trim(),
              document.getElementById("dateNaissance").value.trim(),
              document.getElementById("nationalite").value.trim(),
              document.getElementById("adresse").value.trim(),
              document.getElementById("ville").value.trim(),
              document.getElementById("adresse").value.trim(),
              normalizeRib(document.getElementById("rib").value),
              document.getElementById("bio").value.trim(),
              document.getElementById("photoUrl").value.trim(),
              getSecteursCsv(),
              autreSecteurInput.value.trim()
      );
      if (updateRes !== "OK") {
        showErr((updateRes || "ERROR").replace("ERROR:", ""));
        return;
      }
    }

    const res = bridge.submitProfileForVerification(
            document.getElementById("adresse").value.trim(),
            getPdfStoredPath("cinRectoUrl"),
            getPdfStoredPath("cinVersoUrl"),
            getPdfStoredPath("justificatifDomicileUrl"),
            normalizeRib(document.getElementById("rib").value),
            document.getElementById("bio").value.trim(),
            getPdfStoredPath("registreCommerceUrl"),
            getPdfStoredPath("patenteUrl"),
            getPdfStoredPath("matriculeFiscalUrl"),
            getPdfStoredPath("carteFiscaleUrl"),
            getSecteursCsv(),
            autreSecteurInput.value.trim()
    );

    if (res === "OK") {
      showOk("Demande envoyee a l'admin. Votre compte sera bloque tant que la verification n'est pas validee.");
      setTimeout(() => {
        try {
          if (typeof bridge.logout === "function") {
            const out = bridge.logout();
            if (out === "OK") return;
          }
        } catch (e) {}
        window.location.href = "html/login.html";
      }, 1200);
      return;
    }

    showErr((res || "ERROR").replace("ERROR:", ""));
  });

  document.getElementById("btnSubmit").addEventListener("click", () => {
    const adresse = document.getElementById("adresse").value;

    const cinRectoUrl = document.getElementById("cinRectoUrl").value;
    const cinVersoUrl = document.getElementById("cinVersoUrl").value;
    const justificatifDomicileUrl = document.getElementById("justificatifDomicileUrl").value;

    const rib = document.getElementById("rib").value;
    const bio = document.getElementById("bio").value;

    const registreCommerceUrl = document.getElementById("registreCommerceUrl").value;
    const patenteUrl = document.getElementById("patenteUrl").value;
    const matriculeFiscalUrl = document.getElementById("matriculeFiscalUrl").value;
    const carteFiscaleUrl = document.getElementById("carteFiscaleUrl").value;

    const secteursCsv = getSelectedSecteursCsv(); // selon ta logique (chips / checkbox)
    const autreSecteur = document.getElementById("autreSecteur").value;

    const res = window.bridge.submitProfileForVerification(
            adresse,
            cinRectoUrl,
            cinVersoUrl,
            justificatifDomicileUrl,
            rib,
            bio,
            registreCommerceUrl,
            patenteUrl,
            matriculeFiscalUrl,
            carteFiscaleUrl,
            secteursCsv,
            autreSecteur
    );

    if (String(res).startsWith("ERROR:")) { alert(res); return; }
    window.location.href = "login.html?pending=1";
  });
</script>
</body>
</html>
