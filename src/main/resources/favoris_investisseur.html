<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes news favorites</title>
  <script src="navbar.js" defer></script>
  <style>
    body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Arial;background:#f6f8fc;color:#0f172a}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    h1{margin:0 0 6px;font-size:32px}
    .sub{color:#64748b;font-weight:700;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:620px){.grid{grid-template-columns:1fr;}}
    .card{background:#fff;border:1px solid rgba(15,23,42,.1);border-radius:16px;padding:14px;box-shadow:0 10px 24px rgba(15,23,42,.06)}
    .title{font-size:18px;font-weight:900;margin:0 0 8px}
    .meta{font-size:12px;color:#64748b;margin-bottom:12px}
    .actions{display:flex;gap:8px;justify-content:space-between}
    .btn{border:0;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer}
    .btn.view{background:linear-gradient(135deg,#1d4ed8,#06b6d4);color:#fff}
    .btn.remove{background:rgba(239,68,68,.12);color:#7f1d1d;border:1px solid rgba(239,68,68,.25)}
    .empty{background:#fff;border:1px dashed rgba(15,23,42,.18);border-radius:14px;padding:14px;color:#64748b}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Mes favoris ★</h1>
    <div class="sub">Actualites marquees en favoris.</div>
    <section id="grid" class="grid"></section>
    <div id="empty" class="empty" style="display:none;">Aucun favori pour le moment.</div>
  </main>
  <script>
    const FAV_KEY = "investia_favs";
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    function favItems(){ try{return JSON.parse(localStorage.getItem(FAV_KEY)||"[]");}catch(e){return [];} }
    function removeFav(key){
      const next = favItems().filter(x => x && x.key !== key);
      localStorage.setItem(FAV_KEY, JSON.stringify(next));
      render();
    }
    function render(){
      const list = favItems().filter(x => x && typeof x === "object");
      if (!list.length){
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      grid.innerHTML = list.map(p => `
        <article class="card">
          <h3 class="title">${p.title || "Article"}</h3>
          <div class="meta">${p.source || "Source"} • ${p.publishedAt || ""}</div>
          <div class="actions">
            <a class="btn view" href="${p.url || "#"}" target="_blank" rel="noopener">Voir</a>
            <button class="btn remove" data-key="${p.key || ""}">Retirer</button>
          </div>
        </article>
      `).join("");
      grid.querySelectorAll(".remove").forEach(btn => btn.addEventListener("click",()=>removeFav(btn.dataset.key)));
    }
    render();
    window.__onJavaBridgeReady = render;
  </script>
</body>
</html>
