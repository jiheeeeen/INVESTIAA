<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investia - Remboursements (Investisseur)</title>
  <link rel="stylesheet" href="../financement/financement.css" />
  <script src="../../navbar.js" defer></script>
</head>
<body>
  <main class="container">
    <div class="top">
      <div>
        <span class="badgeTop"><span class="badgeDot"></span>Remboursement - Investisseur</span>
        <h1>Mes remboursements</h1>
        <p class="sub">Liste des echeances liees a vos investissements.</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btnTop btnNavy" href="remboursements-investisseur.html">Rafraichir</a>
      </div>
    </div>

    <section class="card">
      <div class="crudHead">
        <div>
          <h2 class="title" style="margin:0;">Liste</h2>
          <p class="sub" style="margin-top:8px;">Filtre par statut ou recherche par projet/financement.</p>
        </div>
        <div class="crudFilters">
          <div class="fieldSmall">
            <label for="search">Recherche</label>
            <input id="search" placeholder="projet, financement, statut..." />
          </div>
          <div class="fieldSmall">
            <label for="statut">Statut</label>
            <select id="statut">
              <option value="ALL" selected>Tous</option>
              <option value="EN_ATTENTE">EN_ATTENTE</option>
              <option value="PAYE">PAYE</option>
            </select>
          </div>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi"><div class="kpiLabel">Total du</div><div class="kpiValue" id="kDue">0 TND</div></div>
        <div class="kpi"><div class="kpiLabel">Total paye</div><div class="kpiValue" id="kPaid">0 TND</div></div>
        <div class="kpi"><div class="kpiLabel">Nb echeances</div><div class="kpiValue" id="kCount">0</div></div>
      </div>

      <table aria-label="Table des remboursements">
        <thead>
          <tr>
            <th>Projet</th>
            <th>Financement</th>
            <th>Date echeance</th>
            <th>Montant du</th>
            <th>Montant paye</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="note" id="result" style="display:none;"></div>
    </section>
  </main>

  <script>
    let data = [];
    const params = new URLSearchParams(location.search);
    const onlyFinancementId = String(params.get("financementId") || "");

    const tbody = document.getElementById("tbody");
    const search = document.getElementById("search");
    const statut = document.getElementById("statut");
    const result = document.getElementById("result");
    const kDue = document.getElementById("kDue");
    const kPaid = document.getElementById("kPaid");
    const kCount = document.getElementById("kCount");

    function money(n){
      return new Intl.NumberFormat("fr-TN").format(n) + " TND";
    }

    function round2(n){
      return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    }

    function paidCapped(du, paye){
      const d = Math.max(0, Number(du) || 0);
      const p = Math.max(0, Number(paye) || 0);
      return Math.min(d, p);
    }

    function escapeHtml(s){
      return String(s || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("\"","&quot;");
    }

    function computeKpis(rows){
      const totalDu = rows.reduce((a,r) => a + (Number(r.montantDu) || 0), 0);
      const totalPaye = rows.reduce((a,r) => a + paidCapped(r.montantDu, r.montantPaye), 0);
      kDue.textContent = money(round2(totalDu));
      kPaid.textContent = money(round2(totalPaye));
      kCount.textContent = String(rows.length);
    }

    function loadFromDb(){
      if (!window.javaBridge) {
        result.style.display = "block";
        result.textContent = "Bridge Java indisponible.";
        data = [];
        return;
      }
      try {
        let rows = [];
        if (typeof window.javaBridge.getRemboursementsForCurrentInvestorJson === "function") {
          const raw = window.javaBridge.getRemboursementsForCurrentInvestorJson();
          rows = JSON.parse(String(raw || "[]"));
        }

        // Fallback: some datasets expose investor data only via financements endpoint.
        if ((!Array.isArray(rows) || rows.length === 0)
          && typeof window.javaBridge.getFinancementsForCurrentInvestorJson === "function") {
          const rawFin = window.javaBridge.getFinancementsForCurrentInvestorJson();
          const finRows = JSON.parse(String(rawFin || "[]"));
          const investorFinancements = Array.isArray(finRows) ? finRows : [];

          // Preferred fallback: fetch remboursements by each financement id.
          if (typeof window.javaBridge.getRemboursementsByFinancementJson === "function" && investorFinancements.length) {
            const expanded = [];
            investorFinancements.forEach(f => {
              const finId = Number(f.id || 0);
              if (!finId) return;
              try {
                const rawR = window.javaBridge.getRemboursementsByFinancementJson(finId);
                const rembs = JSON.parse(String(rawR || "[]"));
                (Array.isArray(rembs) ? rembs : []).forEach(r => {
                  expanded.push({
                    id: r.id || "",
                    financementId: finId,
                    projectId: f.projectId,
                    projectName: f.projectName,
                    dateEcheance: r.dateEcheance || "",
                    montantDu: r.montantDu || 0,
                    montantPaye: r.montantPaye || 0,
                    statut: r.statut || "EN_ATTENTE"
                  });
                });
              } catch (ignore) {}
            });
            rows = expanded;
          }

          // Last fallback: one synthetic row per financement.
          if (!Array.isArray(rows) || rows.length === 0) {
            rows = investorFinancements.map(f => ({
              id: "",
              financementId: f.id,
              projectId: f.projectId,
              projectName: f.projectName,
              dateEcheance: f.date || "",
              montantDu: f.amount || 0,
              montantPaye: String(f.rembStatus || "").toUpperCase() === "PAYE" ? (f.amount || 0) : 0,
              statut: f.rembStatus || "EN_ATTENTE"
            }));
          }
        }

        // Last-resort fallback: global remboursements filtered by investor financements ids.
        if ((!Array.isArray(rows) || rows.length === 0)
          && typeof window.javaBridge.getFinancementsForCurrentInvestorJson === "function"
          && typeof window.javaBridge.getRemboursementsJson === "function") {
          const rawFin = window.javaBridge.getFinancementsForCurrentInvestorJson();
          const finRows = JSON.parse(String(rawFin || "[]"));
          const finById = new Map();
          (Array.isArray(finRows) ? finRows : []).forEach(f => {
            const key = String(f.id || "");
            if (!key) return;
            finById.set(key, f);
          });

          const rawAll = window.javaBridge.getRemboursementsJson();
          const allRows = JSON.parse(String(rawAll || "[]"));
          rows = (Array.isArray(allRows) ? allRows : [])
            .filter(r => finById.has(String(r.financementId || "")))
            .map(r => {
              const f = finById.get(String(r.financementId || "")) || {};
              return {
                id: r.id || "",
                financementId: r.financementId || "",
                projectId: f.projectId || "",
                projectName: f.projectName || ("Projet #" + String(f.projectId || "")),
                dateEcheance: r.dateEcheance || "",
                montantDu: r.montantDu || 0,
                montantPaye: r.montantPaye || 0,
                statut: r.statut || "EN_ATTENTE"
              };
            });
        }

        data = (Array.isArray(rows) ? rows : []).map(r => {
          const du = Number(r.montantDu || 0);
          const paye = Number(r.montantPaye || 0);
          return {
            id: String(r.id || ""),
            financementId: String(r.financementId || ""),
            projectName: r.projectName || ("Projet #" + String(r.projectId || "")),
            dateEcheance: r.dateEcheance || "",
            montantDu: du,
            montantPaye: paye,
            statut: (paye + 1e-9 >= du && du > 0) ? "PAYE" : "EN_ATTENTE"
          };
        });
        if (!data.length) {
          result.style.display = "block";
          result.textContent = "Aucun remboursement trouve pour cet investisseur (verifier les liens financement/investisseur).";
        } else {
          result.style.display = "none";
          result.textContent = "";
        }
      } catch (e) {
        data = [];
        result.style.display = "block";
        result.textContent = "Erreur chargement remboursements: " + e;
      }
    }

    function applyFilters(){
      const s = (search.value || "").toLowerCase().trim();
      const st = statut.value;
      return data.filter(r => {
        if (onlyFinancementId && String(r.financementId) !== onlyFinancementId) return false;
        if (st !== "ALL" && String(r.statut) !== st) return false;
        if (!s) return true;
        return (
          String(r.projectName || "").toLowerCase().includes(s) ||
          String(r.financementId || "").toLowerCase().includes(s) ||
          String(r.statut || "").toLowerCase().includes(s)
        );
      });
    }

    function render(){
      const rows = applyFilters();
      computeKpis(rows);
      tbody.innerHTML = rows.map(r => {
        const payeAffiche = paidCapped(r.montantDu, r.montantPaye);
        const tag = r.statut === "PAYE"
          ? '<span class="tag ok"><span class="tagDot"></span>PAYE</span>'
          : '<span class="tag pending"><span class="tagDot"></span>EN_ATTENTE</span>';
        return `
          <tr>
            <td><strong>${escapeHtml(r.projectName)}</strong></td>
            <td><a class="softLink" href="../financement/financement-detail.html?id=${encodeURIComponent(String(r.financementId))}">#${r.financementId}</a></td>
            <td>${r.dateEcheance || "-"}</td>
            <td><strong>${money(r.montantDu)}</strong></td>
            <td><strong>${money(payeAffiche)}</strong></td>
            <td>${tag}</td>
          </tr>
        `;
      }).join("");
    }

    function init(){
      loadFromDb();
      render();
    }

    window.onJavaBridgeReady = init;
    function waitForBridge(retries){
      if (window.javaBridge) { init(); return; }
      if (retries <= 0) {
        result.style.display = "block";
        result.textContent = "Bridge Java indisponible.";
        return;
      }
      setTimeout(function(){ waitForBridge(retries - 1); }, 200);
    }
    waitForBridge(30);

    [search, statut].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });
  </script>
</body>
</html>
